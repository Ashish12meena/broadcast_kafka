# Local development: everything on localhost, topics created automatically, verbose logging.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

broadcast:
  kafka:
    auto-create-topics: true
    dispatch-concurrency: 2
  dispatch:
    max-concurrent-sends: 16
  meta:
    max-connections: 16
  rate-limit:
    assumed-instances: 1

eureka:
  client:
    enabled: false

logging:
  level:
    com.aigreentick.services.broadcast: DEBUG
