spring:
  application:
    name: broadcast
    
    include:
      - kafka      # always include kafka
      - mock       # kafka not active by default

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:146.88.24.113:9092}
    consumer:
      group-id: broadcast-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:8090}


messaging:
  service:
    base-url: ${MESSAGING_SERVICE_URL:http://localhost:8050}
    connect-timeout: 5000
    read-timeout: 30000
    paths:
      message-results-callback: /internal/broadcast/callbacks/message-results