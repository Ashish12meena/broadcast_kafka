spring:
  # .env and ../platform.env are imported by application.yml for every profile.

  data:
    redis:
      password: ${REDIS_PASSWORD:}

broadcast:
  kafka:
    auto-create-topics: true
    dispatch-concurrency: ${KAFKA_DISPATCH_CONCURRENCY:2}

  dispatch:
    max-concurrent-sends: 16

  meta:
    max-connections: 16

  rate-limit:
    assumed-instances: ${ASSUMED_INSTANCES:1}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

logging:
  level:
    com.aigreentick.services.broadcast: ${LOG_LEVEL_APP:DEBUG}